name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=${JAVA_HOME:-}"
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable was not found in PATH."
            exit 1
          fi

          JAVA_VER_OUTPUT="$(java -version 2>&1)"
          echo "$JAVA_VER_OUTPUT"

          RAW_VERSION="$(printf '%s\n' "$JAVA_VER_OUTPUT" | head -n 1 | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to detect the active Java version from 'java -version'."
            exit 1
          fi

          if printf '%s' "$RAW_VERSION" | grep -qE '^1\.'; then
            JAVA_MAJOR="$(printf '%s' "$RAW_VERSION" | cut -d. -f2)"
          else
            JAVA_MAJOR="$(printf '%s' "$RAW_VERSION" | cut -d. -f1 | sed -E 's/[^0-9].*$//')"
          fi

          if ! printf '%s' "$JAVA_MAJOR" | grep -qE '^[0-9]+$'; then
            echo "::error::Unable to parse numeric Java major version from '${RAW_VERSION}'."
            exit 1
          fi

          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${JAVA_MAJOR}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./debug.keystore" ]; then
            echo "Existing ./debug.keystore detected; skipping generation."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool was not found at ${KEYTOOL_BIN}."
              exit 1
            fi

            "$KEYTOOL_BIN" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Failed to verify temporary ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::${EXPECTED_APK} does not have a .apk extension."
              exit 1
              ;;
          esac

          APK_SIZE="$(wc -c < "$EXPECTED_APK" | tr -d '[:space:]')"
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified debug APK is missing at ${SOURCE_APK}."
            exit 1
          fi

          REPO_RAW="${GITHUB_REPOSITORY##*/}"
          REPO_SAFE="$(printf '%s' "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$REPO_SAFE" ]; then
            REPO_SAFE="android-app"
          fi

          ASSET_NAME="${REPO_SAFE}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to copy debug APK to temporary release asset path."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Prepared release asset does not preserve the .apk extension."
              exit 1
              ;;
          esac

          echo "Prepared release asset filename: ${ASSET_NAME}"
          {
            echo "asset_path=${ASSET_PATH}"
            echo "asset_name=${ASSET_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not installed on this runner. Release publishing skipped; the 'app-debug-apk' Actions artifact remains available."
            exit 1
          fi

          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::warning::Prepared APK release asset is missing or empty. Release creation aborted; the 'app-debug-apk' Actions artifact remains available."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::warning::Prepared release asset is not a .apk file. Release creation aborted."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "$GITHUB_OUTPUT"

          RELEASE_NOTES="$(cat <<EOF
          Automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **APK Filename:** ${ASSET_NAME}

          > **Testing Build Notice:**
          > This APK is intended for testing only. It is **not** a Google Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )"

          if ! gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest; then
            echo "::warning::Failed to publish GitHub Release '${RELEASE_TAG}'. The APK build succeeded and the 'app-debug-apk' Actions artifact remains available."
            exit 1
          fi

      - name: Report APK download result
        if: ${{ steps.publish_release.outcome == 'success' || steps.publish_release.outcome == 'failure' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG:-debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}}"
          TITLE="${RELEASE_TITLE:-Debug APK Build #${GITHUB_RUN_NUMBER}}"
          RELEASE_VERIFIED=false
          RELEASE_URL=""

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            if RELEASE_URL="$(gh release view "$TAG" --json url --jq '.url' 2>/dev/null)" && [ -n "$RELEASE_URL" ]; then
              RELEASE_VERIFIED=true
            else
              echo "::warning::Release creation returned success, but 'gh release view' could not confirm tag '${TAG}'."
            fi
          fi

          if [ "$RELEASE_VERIFIED" = "true" ]; then
            echo "Release Tag: ${TAG}"
            echo "Release Title: ${TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"

            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "- **Status:** APK build, Actions artifact upload, and GitHub Release publishing succeeded."
              echo "- **Release Title:** ${TITLE}"
              echo "- **Release Tag:** \`${TAG}\`"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              echo "- **GitHub Release Page:** ${RELEASE_URL}"
              echo ""
              echo "Download the APK directly from the **Assets** section of the GitHub Release page above."
              echo "The standard GitHub Actions artifact \`app-debug-apk\` is also available on this workflow run as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed, but the debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available."

            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "> **Warning:** Publishing the GitHub Release failed, so no release URL was created."
              echo ""
              echo "- **APK Build:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Actions Artifact:** \`app-debug-apk\` is available for download on this workflow run."
              echo "- **Backup Download:** Download \`app-debug-apk\` from the **Artifacts** section of this GitHub Actions run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
